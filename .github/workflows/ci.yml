name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright
      - run: pytest --cov=. --cov-report=term-missing
      - run: pip-audit -r requirements-dev.txt

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python build.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site 

  deploy:
    needs: build
    if: github.event_name == 'push' 
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps: 
      - id: deployment
        uses: actions/deploy-pages@v5

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t shop:${{ github.sha }} .
      - run: docker run -d -p 8000:8000 shop:${{ github.sha }}
      - run: docker ps -a
      - run: docker logs $(docker ps -q --filter ancestor=shop:${{ github.sha }})
      - run: curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8000/health
